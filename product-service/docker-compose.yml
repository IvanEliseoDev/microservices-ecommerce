services:
  mongodb:
    image: mongo:7.0.4
    container_name: mongodb
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=mysecretpassword
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  product-service:
    build: .
    container_name: product-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_MONGODB_URI=mongodb://admin:mysecretpassword@mongodb:27017/product-db?authSource=admin
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo_data: